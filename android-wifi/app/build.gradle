plugins {
    id 'com.android.application'
}
android {
    namespace 'ru.fotomag.wificonnect'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.fotomag.wificonnect'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
