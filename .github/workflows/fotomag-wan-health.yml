name: FotoMag WAN HTTPS check (read-only)
on:
  push:
    branches:
      - ops/fotomag-wan-8443-check-20261125
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check external TLS and disabled health
        shell: bash
        run: |
          python3 - <<'PY'
          import json, ssl, socket, sys, urllib.error, urllib.request
          host = "fotomag-izhevsk.dynv6.net"
          url = f"https://{host}:8443/api/health"
          try:
              ip = socket.gethostbyname(host)
              print("DNS_RESOLVED", ip)
              sock = socket.create_connection((host, 8443), timeout=12)
              with ssl.create_default_context().wrap_socket(sock, server_hostname=host) as tls:
                  print("TLS_HANDSHAKE_OK", tls.version())
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              with opener.open(urllib.request.Request(url, headers={
                   "User-Agent": "FotoMag-External-Health/1.0"}), timeout=12) as response:
                  status = response.status
                  payload = json.loads(response.read(2048))
              print("HTTP_STATUS", status)
              print("SERVICE", payload.get("service"))
              print("ACCEPTING_UPLOADS", payload.get("accepting_uploads"))
              if status != 200 or payload.get("service") != "fotomag-direct-upload":
                  sys.exit(3)
              if payload.get("accepting_uploads") is not False:
                  print("FAIL_NOT_DISABLED")
                  sys.exit(3)
              print("PASS_FOTOMAG_WAN_TLS_HEALTH_DISABLED")
          except Exception as exc:
              print("FOTOMAG_EXTERNAL_PROBE_FAILED", type(exc).__name__)
              sys.exit(2)
          PY
