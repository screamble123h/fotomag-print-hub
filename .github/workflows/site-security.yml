name: FotoMag public site security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate site security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify public page and safe destinations
        run: python3 scripts/verify_public_site.py
      - name: Validate approved souvenir catalog and links
        run: python3 scripts/verify_souvenirs.py
      - name: Verify full mug catalog, images and customer links
        run: python3 scripts/verify_mugs.py
      - name: Enforce lightweight mobile page budget
        run: python3 scripts/verify_performance_budget.py
      - name: Verify guarded LAN release and rollback selection
        run: python3 scripts/test_lan_release.py
      - name: Check monitor against current public pages
        run: python3 scripts/test_monitor_site.py
      - name: Test request integrity and interrupted uploads
        run: |
          node scripts/test_mug_order.cjs
          node scripts/test_direct_upload.cjs
      - name: Test smartphone navigation and disabled upload in Chrome
        run: |
          python3 -m venv "$RUNNER_TEMP/fotomag-browser"
          "$RUNNER_TEMP/fotomag-browser/bin/pip" install playwright==1.62.0
          "$RUNNER_TEMP/fotomag-browser/bin/python" scripts/test_personal_contacts.py
          "$RUNNER_TEMP/fotomag-browser/bin/python" scripts/test_souvenirs.py
          "$RUNNER_TEMP/fotomag-browser/bin/python" scripts/test_mugs.py
