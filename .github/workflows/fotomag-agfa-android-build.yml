name: FotoMag AGFA Android build

on:
  push:
    paths:
      - "android-wifi/**"
      - ".github/workflows/fotomag-agfa-android-build.yml"
  pull_request:
    paths:
      - "android-wifi/**"
      - ".github/workflows/fotomag-agfa-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android 11+ APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download verified Gradle 8.13
        shell: bash
        run: |
          curl -fsSL --retry 3 --max-time 180 \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.13-bin.zip"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/gradle-8.13-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Verify installed SDK
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Build debug APK
        run: gradle -p android-wifi :app:assembleDebug --no-daemon --stacktrace
      - name: Check APK signature and permissions
        shell: bash
        run: |
          APK=android-wifi/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/fotomag-wifi-permissions.txt
          if grep -q "uses-permission:" /tmp/fotomag-wifi-permissions.txt; then
            echo "Unexpected permission in minimal FotoMag Wi-Fi app" >&2
            exit 1
          fi
          sha256sum "$APK"
      - name: Export pilot APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoMag-AGFA-Android-pilot
          path: android-wifi/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
